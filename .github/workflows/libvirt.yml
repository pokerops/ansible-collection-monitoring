---
name: libvirt
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libvirt:
    name: libvirt
    runs-on: libvirt
    strategy:
      matrix:
        image:
          - name: resolute
            url: https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img
          - name: noble
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - name: jammy
            url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
        scenario:
          - legacy
    env:
      MOLECULE_LOGDIR: "/tmp/logs"
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v5

      - name: Run devbox tests
        uses: pokerops/ansible-utils@master
        with:
          checkout: false
          run: >
            just
            --set MOLECULE_LOGDIR ${{ env.MOLECULE_LOGDIR }}
            --set MOLECULE_SCENARIO ${{ matrix.scenario }}
            --set MOLECULE_KVM_IMAGE ${{ matrix.image.url }}
            requirements test

      - name: Upload install logs
        uses: actions/upload-artifact@v4
        with:
          name: install.${{ matrix.image.name }}
          path: |
            ${{ env.MOLECULE_LOGDIR }}/*.log
          if-no-files-found: ignore
        if: always()
