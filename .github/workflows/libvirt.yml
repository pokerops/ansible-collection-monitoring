---
name: libvirt
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libvirt:
    name: libvirt
    runs-on: libvirt
    strategy:
      matrix:
        image:
          - name: noble
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - name: jammy
            url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          - name: trixie
            url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-nocloud-amd64.qcow2
        scenario:
          - default
    env:
      MOLECULE_LOGDIR: "/tmp/logs"
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v5

      - name: Run just configure
        uses: pokerops/ansible-utils@master
        with:
          run: >
            just
            --set GIT_REPO ${{ github.event.pull_request.head.repo.full_name }}
            --set GIT_BRANCH ${{ github.head_ref || github.ref_name }}
            configure

      - name: Debug configuration changes
        run: git diff

      - name: Run devbox tests
        uses: pokerops/ansible-utils@master
        with:
          checkout: false
          run: >
            just
            --set MOLECULE_LOGDIR ${{ env.MOLECULE_LOGDIR }}
            --set MOLECULE_SCENARIO ${{ matrix.scenario }}
            --set MOLECULE_KVM_IMAGE ${{ matrix.image.url }}
            requirements test

      - name: Upload install logs
        uses: actions/upload-artifact@v4
        with:
          name: install.${{ matrix.image.name }}
          path: |
            ${{ env.MOLECULE_LOGDIR }}/*.log
          if-no-files-found: ignore
        if: always()
