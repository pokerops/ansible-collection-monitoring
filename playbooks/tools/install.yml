---
- name: Install pokerops python tools
  hosts: "{{ monitoring_clients | default('monitoring_clients') }}:!{{ monitoring_exclude | default('monitoring_exclude') }}"
  become: true
  roles:
    - pokerops.monitoring.monitoring
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == "Debian"
      changed_when: false

    - name: Install virtualenv packages
      ansible.builtin.package:
        name: "{{ ['virtualenv'] + ([] if monitoring_script_package | length > 0 else ['git']) }}"

    # Copy local wheel build
    - name: Copy monitoring script package
      ansible.builtin.copy:
        src: "{{ monitoring_script_package }}"
        dest: "/tmp/{{ monitoring_script_package | basename }}"
        mode: "u=rw,og=r"
      when: monitoring_script_package | length > 0

    - name: Initialize virtualenv
      ansible.builtin.pip:
        name:
          - "{{ _monitoring_script_source }}"
        virtualenv: "{{ monitoring_script_venv }}"
      vars:
        _monitoring_script_git: "git+{{ monitoring_script_repo_url }}@{{ monitoring_script_repo_version }}"
        _monitoring_script_wheel: "/tmp/{{ monitoring_script_package | basename }}"
        _monitoring_script_source: "{{ _monitoring_script_wheel if monitoring_script_package | length > 0 else _monitoring_script_git }}"

    - name: Create monitoring script
      ansible.builtin.copy:
        dest: "{{ monitoring_script_path }}"
        content: |
          #!/usr/bin/env bash
          {{ monitoring_script_venv }}/bin/monitor $@
        mode: "u=rwx,og=rx"
