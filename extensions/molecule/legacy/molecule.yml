---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: default
platforms:
  - name: monitoring-${MOLECULE_SCENARIO_NAME}-server-01
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 4
    mem: 8
    groups:
      - monitoring_clients
      - rke2_server
  - name: monitoring-${MOLECULE_SCENARIO_NAME}-server-02
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 4
    mem: 8
    groups:
      - monitoring_clients
      - rke2_server
  - name: monitoring-${MOLECULE_SCENARIO_NAME}-server-03
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 4
    mem: 8
    groups:
      - monitoring_clients
      - rke2_server
provisioner:
  name: ansible
  env:
    ANSIBLE_PIPELINING: true
  playbooks:
    create: ../common/create.yml
    prepare: ../common/prepare.yml
    converge: ../common/install.yml
    cleanup: ../common/cleanup.yml
    destroy: ../common/destroy.yml
    side_effect: ../common/uninstall.yml
    verify: ../common/verify.yml
  config_options:
    defaults:
      allow_broken_conditionals: true
      callbacks_enabled: ansible.posix.profile_tasks
      callback_whitelist: profile_tasks, timer, yaml
  inventory:
    hosts:
      all:
        vars:
          # Molecule params
          ansible_ssh_extra_args: "-o ControlPersist=no -o ControlPath=none"
          libvirt_user: molecule
          libvirt_address: "172.31.252.1/24"
          # The rke2 platform images alone take over 13G, the default guest disk leaves no headroom
          libvirt_guest_size: "40G"
          libvirt_platforms: "{{ molecule_yml.platforms }}"
          # Control plane VIP, carved out of the block between the guests (consecutive from .2) and the end of the network
          molecule_pool_api: "{{ libvirt_address | ansible.utils.ipsubnet((libvirt_address | ansible.utils.ipaddr('prefix') | int) + 2, 1) }}"
          molecule_api_vip: "{{ molecule_pool_api | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
          molecule_install_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_OUTPUT_DIR', default='/tmp/logs') }}"
          molecule_install_log: "{{ molecule_install_dir }}/${MOLECULE_SCENARIO_NAME}"
          molecule_local_kubeconfig: "{{ lookup('ansible.builtin.env', 'MOLECULE_LOCAL_KUBECONFIG') }}"
          molecule_tmpdir:
            - /tmp/molecule
            - /tmp/filesystem
          # RKE2 params
          rke2_frr_config_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/frr"
          rke2_cluster_name: monitoring.pokerops.net
          rke2_ippool_private: "172.16.16.0/24"
          rke2_metallb_mode: bgp
          rke2_metallb_bgp_asn: 64513
          rke2_api_url: "https://api.{{ rke2_cluster_name }}:6443"
          rke2_token: "secret"
          rke2_kubevip_address: "{{ molecule_api_vip }}"
          rke2_longhorn_replica_count: 2
          # RabbitMQ test params
          rabbitmq_vhost: molecule
          rabbitmq_user_name: molecule
          rabbitmq_user_pass: molecule
          rabbitmq_queue: "vector-{{ inventory_hostname }}"
          rabbitmq_host: "{{ rke2_ippool_private | ansible.utils.ipaddr('-1') | ansible.utils.ipaddr('address') }}" #  fixed address from private pool
          rabbitmq_port: 5672
          rabbitmq_api_port: 15672
          # Monitoring params
          monitoring_agent: "${MONITORING_AGENT:-alloy}"
          monitoring_vector_output_file_enable: true
          monitoring_agent_location: "local"
          monitoring_agent_environment: "molecule"
          monitoring_agent_function: "test"
          monitoring_elasticsearch_hosts: []
          monitoring_elasticsearch_username: "elasticsearch"
          monitoring_elasticsearch_password: "elasticsearch"
          monitoring_heartbeat_conf_monitors:
            - type: http
              id: "google"
              name: "Google"
              schedule: "@every 10s"
              urls:
                - "https://www.google.com"
              check.response.status: 200
          monitoring_metricbeat_modules:
            system:
              - module: system
                enabled: true
                metricsets:
                  - cpu
                  - load
                  - memory
                  - network
                  - diskio
                  - filesystem
                cpu:
                  metrics:
                    - percentages
                    - normalized_percentages
                period: 10s
            systemd:
              - module: system
                enabled: true
                metricsets:
                  - process
                processes: ["systemd$$"]
                period: 10s
          monitoring_filebeat_modules:
            postgresql:
              - module: postgresql
                log:
                  enabled: true
                  var.paths:
                    - /var/log/postgresql/postgresql-*.log
          monitoring_filebeat_inputs:
            - type: filestream
              id: mongodb
              paths:
                - "/var/log/mongodb/mongod.log"
            - type: filestream
              id: mysqlrouter
              paths:
                - "/var/log/mysqlrouter/mysqlrouter.log"
          monitoring_filesystem_checks:
            - path: "{{ molecule_tmpdir[0] }}"
              recursive: true
              interval: 10
              name: "*.txt"
            - path: "{{ molecule_tmpdir[1] }}"
              recursive: true
              interval: 10
              size: 1k
          monitoring_rabbitmq_checks:
            molecule:
              - username: "{{ rabbitmq_user_name }}"
                password: "{{ rabbitmq_user_pass }}"
                host: "{{ rabbitmq_host }}"
                port: "{{ rabbitmq_port }}"
                queue: "{{ rabbitmq_queue }}"

verifier:
  name: ansible
scenario:
  create_sequence:
    - dependency
    - create
  prepare_sequence:
    - prepare
  converge_sequence:
    - converge
  destroy_sequence:
    - destroy
  cleanup_sequence:
    - cleanup
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - verify
    - cleanup
