---
- name: Prepare KVM guests
  hosts: "all"
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

    - name: Install gpg agent
      ansible.builtin.apt:
        package: gpg-agent
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

    - name: Install python3 binary redirection
      ansible.builtin.apt:
        name: python-is-python3
      when: ansible_facts.os_family == 'Debian'

    - name: Install multipath tools
      ansible.builtin.package:
        name: "{{ (ansible_facts.os_family == 'Debian') | ternary(_multipath_deb, _multipath_rpm) }}"
      vars:
        _multipath_deb: multipath-tools
        _multipath_rpm: device-mapper-multipath

    - name: Create api host file entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: ".*{{ _api_hostname }}.*"
        line: "{{ _api_address }} {{ _api_hostname }}"
      vars:
        _api_hostname: "{{ rke2_api_url | urlsplit('hostname') }}"
        _api_address: "{{ rke2_kubevip_address | default(ansible_facts.default_ipv4.address) }}"

- name: Deploy rke2 cluster
  import_playbook: pokerops.rke2.install

- name: Copy rke2 kubeconfig
  hosts: rke2_server
  run_once: true
  tasks:
    - name: Fetch kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: kubeconfig_query
      become: true

    - name: Write kubeconfig
      ansible.builtin.copy:
        content: "{{ kubeconfig_query.content | b64decode | regex_replace('server: https://127.0.0.1:6443', 'server: ' ~ rke2_api_url) }}"
        dest: "{{ molecule_local_kubeconfig }}"
      delegate_to: localhost
