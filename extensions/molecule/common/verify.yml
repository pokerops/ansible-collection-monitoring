---
- name: Install and configure beat packages
  hosts: all:!localhost
  become: true
  roles:
    - pokerops.monitoring.monitoring
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify beats daemons
      ansible.builtin.assert:
        that:
          - service_installed
          - service_running
          - service_enabled
        fail_msg: "{{ fail_uninstalled if not service_installed else (fail_offline if not service_running else fail_disabled) }}"
      vars:
        fail_uninstalled: "{{ item }} service is not installed"
        fail_offline: "{{ item }} service is not running"
        fail_disabled: "{{ item }} service is not enabled"
        service_installed: "{{ item + '.service' in ansible_facts.services }}"
        service_running: "{{ ansible_facts.services[item + '.service'].state == 'running' }}"
        service_enabled: "{{ ansible_facts.services[item + '.service'].status == 'enabled' }}"
      loop:
        - filebeat
        - metricbeat
        - heartbeat-elastic

    - name: Create log paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "/var/log/mongodb"
        - "/var/log/mysqlrouter"

    - name: Create log samples
      ansible.builtin.template:
        src: "{{ item.name }}.j2.log"
        dest: "{{ item.path }}"
        owner: root
        group: syslog
      vars:
        _ansible_date: "{{ ansible_date_time }}"
      loop_control:
        label: "{{ item.path }}"
      loop:
        - name: mongod
          path: /var/log/mongodb/mongod.log
          date: "{{ _ansible_date.iso8601 }}"
        - name: mysqlrouter
          path: /var/log/mysqlrouter/mysqlrouter.log
          date: "{{ _ansible_date.date }} {{ _ansible_date.time }}"

    - name: Pause for 15 seconds to allow beats to send data
      ansible.builtin.pause:
        seconds: 15

    - name: Slurp filebeat events
      ansible.builtin.slurp:
        src: /var/log/vector/filebeat.log
      register: filebeat_process_log

    - name: Decode filebeat events
      ansible.builtin.set_fact:
        filebeat_events: "{{ _event_lines | map('from_json') }}"
      vars:
        _event_lines: "{{ filebeat_process_log.content | b64decode | split('\n') | reject('equalto', '') }}"

    - name: Verify filebeat mysqlrouter log ingest
      ansible.builtin.assert:
        that:
          - _mysqlrouter | rejectattr('mysqlrouter.type', 'defined') | length == 0
          - _mysqlrouter | rejectattr('mysqlrouter.level', 'defined') | length == 0
          - _mysqlrouter | rejectattr('mysqlrouter.thread_id', 'defined') | length == 0
          - (_types | length) == (_mysqlrouter | length )
          - (_levels | length) == (_mysqlrouter | length )
          - (_thread_ids | length) == (_mysqlrouter | length )
      vars:
        _mysqlrouter_path: "/var/log/mysqlrouter/mysqlrouter.log"
        _mysqlrouter: "{{ filebeat_events | selectattr('log.file.path', 'equalto', _mysqlrouter_path) | list }}"
        _types: "{{ _mysqlrouter | map(attribute='mysqlrouter.type') }}"
        _levels: "{{ _mysqlrouter | map(attribute='mysqlrouter.level') }}"
        _thread_ids: "{{ _mysqlrouter | map(attribute='mysqlrouter.thread_id') }}"

    - name: Verify filebeat mongodb log ingest
      ansible.builtin.assert:
        that:
          - _mongodb | rejectattr('mongodb.severity', 'defined') | length == 0
          - _mongodb | rejectattr('mongodb.log_id', 'defined') | length == 0
          - _mongodb | rejectattr('mongodb.context', 'defined') | length == 0
          - _mongodb | rejectattr('mongodb.message', 'defined') | length == 0
          - _mongodb | rejectattr('mongodb.component', 'defined') | length == 0
          - (_severities | length) == (_mongodb | length)
          - (_log_ids | length) == (_mongodb | length)
          - (_contexts | length) == (_mongodb | length)
          - (_messages | length) == (_mongodb | length)
          - (_components | length) == (_mongodb | length)
      vars:
        _mongodb_path: "/var/log/mongodb/mongod.log"
        _mongodb: "{{ filebeat_events | selectattr('log.file.path', 'equalto', _mongodb_path) | list }}"
        _severities: "{{ _mongodb | map(attribute='mongodb.severity') }}"
        _log_ids: "{{ _mongodb | map(attribute='mongodb.log_id') }}"
        _contexts: "{{ _mongodb | map(attribute='mongodb.context') }}"
        _messages: "{{ _mongodb | map(attribute='mongodb.message') }}"
        _components: "{{ _mongodb | map(attribute='mongodb.component') }}"

    - name: Slurp metricbeat events
      ansible.builtin.slurp:
        src: /var/log/vector/metricbeat.log
      register: metricbeat_process_log

    - name: Decode metricbeat events
      ansible.builtin.set_fact:
        metricbeat_events: "{{ _event_lines | map('from_json') }}"
      vars:
        _event_lines: "{{ metricbeat_process_log.content | b64decode | split('\n') | reject('equalto', '') }}"

    - name: Decode process events
      ansible.builtin.set_fact:
        metricbeat_processes_systemd: "{{ metricbeat_processes_all | selectattr('process.executable', 'search', 'systemd$') | list }}"
      vars:
        metricbeat_processes_all: "{{ metricbeat_events | selectattr('metricset.name', 'equalto', 'process') | list }}"

    - name: Verify metricbeat process monitoring
      ansible.builtin.assert:
        that: metricbeat_processes_systemd | length > 0
        success_msg: "{{ metricbeat_processes_systemd | length }} events found for systemd processes"
        fail_msg: "{{ metricbeat_processes_systemd | length }} events found for systemd processes"

    - name: Slurp filesystem events
      ansible.builtin.slurp:
        src: /var/log/vector/filesystem.log
      register: filebeat_filesystem_log

    - name: Decode filesystem events
      ansible.builtin.set_fact:
        filesystem_events: "{{ _event_lines | map('from_json') }}"
      vars:
        _event_lines: "{{ filebeat_filesystem_log.content | b64decode | split('\n') | reject('equalto', '') }}"

    - name: Verify filesystem monitor events
      ansible.builtin.assert:
        that:
          - _filesystem_events | length > 0
          - _filesystem_paths | length == 2
          - _filesystem_paths | difference(molecule_tmpdir) | length == 0
        success_msg: "{{ _filesystem_events | length }} filesystem events found for monitored paths"
        fail_msg: "{{ _filesystem_events | length }} filesystem events found for monitored paths"
      vars:
        _filesystem_events: "{{ filesystem_events }}"
        _filesystem_paths: "{{ _filesystem_events | map(attribute='filesystem.path') | unique }}"

    - name: Record python interpreter path
      ansible.builtin.set_fact:
        _environment_python: "{{ ansible_facts.python.executable }}"

    - name: Manage virtualenv tasks
      block:
        - name: Build Vector RabbitMQ fact
          ansible.builtin.set_fact:
            _monitoring_rabbitmq_checks: "{{ _connection_strings }}"
          vars:
            _map_join: "nephelaiio.plugins.map_join"
            _to_dict: "nephelaiio.plugins.to_dict"
            _map_format: "nephelaiio.plugins.map_format"
            _pairs: "nephelaiio.plugins.pairs"
            _cons: "nephelaiio.plugins.cons"
            _default:
              port: 5672
              scheme: "amqp"
              consumer: "vector"
            _rabbitmq: "{{ monitoring_rabbitmq_checks | dict2items | sort(attribute='key') }}"
            _vhosts_data: "{{ _rabbitmq | map(attribute='key') }}"
            _vhosts_dict: "{{ _vhosts_data | map(_to_dict, 'vhost') | map(_cons) }}"
            _values_data: "{{ _rabbitmq | map(attribute='value') }}"
            _vhosts: "{{ _vhosts_dict | zip(_values_data) | map(_pairs) | map('map', 'combine') | flatten }}"
            _checks_default: "{{ [_default] | product(_vhosts) | map('combine') }}"
            _credentials_settings: "{{ _checks_default | map(_map_join, ['username', 'password'], ':') }}"
            _credentials_dict: "{{ _credentials_settings | map(_to_dict, 'credentials') }}"
            _credentials: "{{ _checks_default | zip(_credentials_dict) | map('combine') }}"
            _schemes: "{{ _credentials | map(attribute='scheme') }}"
            _schemes_format: "{{ _schemes | map(_map_format, '%s://') }}"
            _schemes_dict: "{{ _schemes_format | map(_to_dict, 'scheme') }}"
            _schemes_overwritten: "{{ _credentials | zip(_schemes_dict) | map('combine') }}"
            _server_settings: "{{ _schemes_overwritten | map(_map_join, ['host', 'port'], ':') }}"
            _servers_dict: "{{ _server_settings | map(_to_dict, 'server') }}"
            _servers: "{{ _schemes_overwritten | zip(_servers_dict) | map('combine') }}"
            _auth_settings: "{{ _servers | map(_map_join, ['scheme', 'credentials'], '') }}"
            _auth_dict: "{{ _auth_settings | map(_to_dict, 'auth') }}"
            _auths: "{{ _servers | zip(_auth_dict) | map('combine') }}"
            _amqp_settings: "{{ _auths | map(_map_join, ['auth', 'server'], '@') }}"
            _amqp_dict: "{{ _amqp_settings | map(_to_dict, 'amqp') }}"
            _amqps: "{{ _auths | zip(_amqp_dict) | map('combine') }}"
            _connection_string_settings: "{{ _amqps | map(_map_join, ['amqp', 'vhost'], '/') }}"
            _connection_strings_dict: "{{ _connection_string_settings | map(_to_dict, 'connection_string') }}"
            _connection_strings: "{{ _amqps | zip(_connection_strings_dict) | map('combine') }}"

        - name: Install virtualenv packages
          ansible.builtin.package:
            name:
              - virtualenv

        - name: Create virtualenv
          ansible.builtin.tempfile:
            state: directory
            suffix: virtualenv
          register: _virtualenv_tmpdir

        - name: Set virtualenv facts
          ansible.builtin.set_fact:
            _virtualenv_path: "{{ _path }}"
            _virtualenv_python: "{{ _python }}"
          vars:
            _path: "{{ _virtualenv_tmpdir.path }}/venv"
            _python: "{{ _path }}/bin/python"

        - name: Initialize virtualenv
          ansible.builtin.pip:
            name:
              - pika
            virtualenv: "{{ _virtualenv_path }}"

        - name: Drop vector RabbitMQ log file
          ansible.builtin.file:
            path: /var/log/vector/rabbitmq.log
            state: absent

        - name: Change python interpreter
          ansible.builtin.set_fact:
            ansible_python_interpreter: "{{ _virtualenv_python }}"

        - name: Publish a test message
          community.rabbitmq.rabbitmq_publish:
            exchange: "{{ rabbitmq_queue }}_exchange"
            routing_key: "{{ rabbitmq_queue }}.routing.key"
            url: "{{ item.connection_string }}"
            body: "{{ _message | to_json }}"
            content_type: "application/json"
            durable: true
          vars:
            _message:
              text: "This is a test message"
              date: "{{ ansible_date_time.iso8601 }}"
          loop_control:
            label: "{{ item.vhost }} - {{ item.queue }}"
          loop: "{{ _monitoring_rabbitmq_checks }}"

        - name: Pause for 15 seconds to allow RabbitMQ receive message
          ansible.builtin.pause:
            seconds: 15

        - name: Query RabbitMQ messages
          ansible.builtin.set_fact:
            rabbitmq_query: "{{ lookup('community.rabbitmq.rabbitmq', url=_url, queue='molecule') }}"
          vars:
            _rabbitmq: "{{ _monitoring_rabbitmq_checks | first }}"
            _url: "{{ _rabbitmq['connection_string'] }}"

        - name: Slurp rabbitmq events
          ansible.builtin.slurp:
            src: /var/log/vector/rabbitmq.log
          register: rabbitmq_process_log

        - name: Decode rabbitmq events
          ansible.builtin.set_fact:
            rabbitmq_events: "{{ _event_lines | map('from_json') }}"
          vars:
            _event_lines: "{{ rabbitmq_process_log.content | b64decode | split('\n') | reject('equalto', '') }}"

        - name: Debug RabbitMQ query
          ansible.builtin.debug:
            var: rabbitmq_query

        - name: Debug RabbitMQ Vector log file
          ansible.builtin.debug:
            msg: "{{ rabbitmq_events }}"

        - name: Verify rabbitmq log ingest
          ansible.builtin.assert:
            that:
              - (_match_keys | length) == (_query_keys | length)
              - _events_data == _query_data
          vars:
            _input: "{{ _monitoring_rabbitmq_checks }}"
            _input_queues: "{{ _input | map(attribute='queue') }}"
            _events: "{{ rabbitmq_events }}"
            _query: "{{ rabbitmq_query }}"
            _query_keys: "{{ _query | map(attribute='json') | map('dict2items') | flatten | map(attribute='key') | unique }}"
            _event_keys: "{{ _events | map('dict2items') | flatten | map(attribute='key') | unique }}"
            _match_keys: "{{ _event_keys | select('in', _query_keys) }}"
            _events_data: "{{ _events | map('nephelaiio.plugins.select_attributes', _match_keys) }}"
            _query_data: "{{ _query | map(attribute='json') }}"

      always:
        - name: Restore python interpreter
          ansible.builtin.set_fact:
            ansible_python_interpreter: "{{ _environment_python }}"

        - name: Destroy virtualenv
          ansible.builtin.file:
            path: "{{ _virtualenv_tmpdir.path }}"
            state: absent
